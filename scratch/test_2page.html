<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@page {
    size: A4 portrait;
    margin: 0;
}
html, body {
    margin: 0;
    padding: 0;
    background: #fff;
}
.page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 10mm;
    page-break-after: always;
}
.page:last-child {
    page-break-after: avoid;
}
</style>
</head>
<body>
<div class="page"><h1>Page 1</h1></div>
<div class="page"><h1>Page 2</h1></div>
</body>
</html>
